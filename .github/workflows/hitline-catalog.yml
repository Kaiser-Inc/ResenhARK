name: Hitline catalog

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec tsx src/scripts/catalog/build.ts
      - name: Open a pull request with the new songs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- apps/api/src/app/games/hitline/catalog.json; then
            echo "No new songs this week."
            exit 0
          fi
          branch="chore/hitline-catalog-$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add apps/api/src/app/games/hitline/catalog.json apps/api/src/scripts/catalog/report.md
          git commit -m "chore(api): weekly Hitline catalog refresh"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(api): Hitline catalog refresh $(date +%Y-%m-%d)" \
            --body-file apps/api/src/scripts/catalog/report.md
